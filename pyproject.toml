[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "flightops-sentinel"
version = "0.1.0"
description = "Production-oriented flight departure delay risk prediction platform."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [
  { name = "FlightOps Sentinel Contributors" },
]
dependencies = [
  "fastapi>=0.115,<1",
  "matplotlib>=3.10,<4",
  "mlflow>=2.22,<2.23",
  "pandas>=2.2,<3",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6,<7",
  "prometheus-client>=0.21,<1",
  "scikit-learn>=1.6,<1.7",
  "optuna>=4.2,<5",
  "xgboost>=2.1,<3",
  "lightgbm>=4.6,<5",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
  "types-PyYAML>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/flightops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["mlflow", "mlflow.*", "pandas", "sklearn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["flightops.training.features"]
# sklearn's estimator bases are untyped; keep strict checking for our own methods.
disallow_subclassing_any = false
