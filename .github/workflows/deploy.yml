name: Deploy

on:
  workflow_run:
    workflows: [Publish Images]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  staging:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: staging
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: azure/setup-kubectl@v4
      - run: helm upgrade --install flightops deploy/helm/flightops --namespace flightops-staging --create-namespace --set image.repository=ghcr.io/${{ github.repository_owner }}/flightops-api --set image.tag=${{ github.event.workflow_run.head_sha }} --set api.smokeFlightId=${{ vars.SMOKE_FLIGHT_ID }}
      - run: kubectl rollout status deployment/flightops --namespace flightops-staging --timeout=180s
      - run: kubectl get service flightops --namespace flightops-staging
      - run: kubectl run flightops-smoke --namespace flightops-staging --rm -i --restart=Never --image=curlimages/curl:8.11.1 -- curl --fail http://flightops:8000/health/ready

  production:
    needs: staging
    environment: production
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: azure/setup-kubectl@v4
      - run: helm upgrade --install flightops deploy/helm/flightops --namespace flightops-production --create-namespace --set image.repository=ghcr.io/${{ github.repository_owner }}/flightops-api --set image.tag=${{ github.event.workflow_run.head_sha }}
