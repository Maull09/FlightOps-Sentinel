name: Publish Images

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: docker/api/Dockerfile
          - name: pipeline
            dockerfile: docker/pipeline/Dockerfile
          - name: airflow
            dockerfile: docker/airflow/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/flightops-${{ matrix.name }}:${{ github.sha }}
      - uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/flightops-${{ matrix.name }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'
