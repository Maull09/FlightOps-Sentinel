name: Publish Images

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: docker/api/Dockerfile
          - name: pipeline
            dockerfile: docker/pipeline/Dockerfile
          - name: airflow
            dockerfile: docker/airflow/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        shell: bash
        run: echo "repository=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/flightops-${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.image.outputs.repository }}:${{ github.sha }}
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.repository }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'
