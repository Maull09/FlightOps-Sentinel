apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flightops.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "flightops.fullname" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "flightops.fullname" . }}
    spec:
      serviceAccountName: {{ include "flightops.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            - configMapRef:
                name: {{ include "flightops.fullname" . }}-config
            - secretRef:
                name: {{ .Values.api.existingSecret }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
          resources:
{{ toYaml .Values.resources | indent 12 }}
